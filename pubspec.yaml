name: pudding
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  material_symbols_icons: ^4.2719.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: NanumBarunpen
      fonts:
        - asset: assets/fonts/NanumBarunpenB.ttf
          weight: 700
        - asset: assets/fonts/NanumBarunpenR.ttf
          weight: 400

    - family: RiaSans
      fonts:
        - asset: assets/fonts/RiaSans-Bold.ttf

  assets:
    - assets/img/
